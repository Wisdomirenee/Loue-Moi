<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Lieu | LOUE-MOI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="venue.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="text-2xl font-black text-white tracking-wider hover:text-amber-400 transition">LOUE-MOI</a>
                <span class="text-xs bg-slate-800 text-amber-400 px-2.5 py-1 rounded-full font-semibold border border-slate-700">Détail du Lieu</span>
            </div>
            <div>
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-full border border-slate-700 transition flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Retour au catalogue</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL DE LA SALLE -->
    <main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full">
        <div id="venue-details-container" class="grid grid-cols-1 lg:grid-cols-3 gap-12">
            
            <!-- Colonne Gauche & Milieu : Visuels et Description (2/3) -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Image principale -->
                <div class="relative h-96 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl">
                    <img id="venue-image" src="" alt="Visuel du lieu" class="w-full h-full object-cover">
                    <span id="venue-price" class="absolute top-6 right-6 bg-slate-950/80 backdrop-blur px-4 py-2 rounded-full text-sm font-bold text-amber-400 border border-slate-700 shadow"></span>
                </div>

                <!-- Informations générales -->
                <div>
                    <div class="flex items-center space-x-3 mb-4">
                        <span id="venue-type" class="text-xs bg-slate-900 text-slate-300 px-3.5 py-1 rounded-md font-semibold border border-slate-800"></span>
                        <span id="venue-location" class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1 text-amber-400"></i></span>
                    </div>
                    <h1 id="venue-title" class="text-3xl md:text-4xl font-extrabold text-white mb-4">Chargement...</h1>
                    <p id="venue-description" class="text-slate-300 text-sm md:text-base leading-relaxed mb-6"></p>
                </div>

                <!-- Équipements -->
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6">
                    <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-4">Équipements inclus</h3>
                    <div id="venue-amenities" class="flex flex-wrap gap-2">
                        <!-- Injecté dynamiquement -->
                    </div>
                </div>
            </div>

            <!-- Colonne Droite : Formulaire de Demande de Réservation (1/3) -->
            <div>
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl sticky top-28">
                    <h3 class="text-lg font-bold text-white mb-2">Réserver ce lieu</h3>
                    <p class="text-xs text-slate-400 mb-6">Sélectionnez votre date souhaitée. Votre fiche de renseignement sera utilisée pour la demande.</p>

                    <form id="booking-form" onsubmit="submitBooking(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1">Date de l'événement</label>
                            <input type="date" id="booking-date" required class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-xl text-sm text-white focus:border-amber-400 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1">Nombre d'invités prévus</label>
                            <input type="number" id="booking-guests" required placeholder="Ex: 50" class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-xl text-sm text-white focus:border-amber-400 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1">Commentaires / Demandes particulières</label>
                            <textarea id="booking-notes" rows="3" placeholder="Horaires, organisation..." class="w-full bg-slate-950 border border-slate-700 px-4 py-2.5 rounded-xl text-sm text-white focus:border-amber-400 focus:outline-none"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl text-sm transition shadow-lg mt-4">
                            Envoyer la demande de réservation
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-950 border-t border-slate-800 py-8 text-center text-xs text-slate-500">
        <p>&copy; 2026 LOUE-MOI — Équipe : Traoré Kadiatou, Allebi Anne-Samuelle, Niamba Niamba Irénée Cyrusse.</p>
    </footer>

    <!-- SCRIPT DÉDIÉ À LA PAGE DE DÉTAIL -->
    <script type="module" src="venue.js"></script>
</body>
</html>
