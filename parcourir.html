<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcourir les espaces | Loue-Moi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/parcourir.css">
</head>
<body>

  <!-- Barre de navigation (identique à index.html) -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">
        <i class="fa-solid fa-house-circle-check me-2"></i>Loue-Moi
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="nav-link active" href="parcourir.html">Parcourir les espaces</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Comment ça marche ?</a></li>
          <li class="nav-item ms-lg-3"><a class="btn btn-outline-primary me-2" href="connexion.html">Connexion</a></li>
          <li class="nav-item"><a class="btn btn-primary" href="inscription.html">S'inscrire</a></li>
        </ul> 
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row g-4">

      <!-- Colonne des filtres -->
      <aside class="col-lg-3">
        <form id="form-filtres" class="card border-0 shadow-sm p-3 filtres">
          <h2 class="h5 fw-bold mb-3"><i class="fa-solid fa-sliders text-primary me-2"></i>Filtres</h2>

          <label for="filtre-ville" class="form-label fw-semibold">Ville</label>
          <input type="text" id="filtre-ville" class="form-control mb-3" placeholder="Ex : Chicoutimi">

          <label for="filtre-type" class="form-label fw-semibold">Type d'événement</label>
          <select id="filtre-type" class="form-select mb-3">
            <option value="">Tous les types</option>
            <option value="mariage">Mariage / Fête</option>
            <option value="conference">Conférence / Réunion</option>
            <option value="studio">Studio photo / Vidéo</option>
            <option value="anniversaire">Anniversaire</option>
          </select>

          <label for="filtre-capacite" class="form-label fw-semibold">Capacité minimale</label>
          <input type="number" id="filtre-capacite" class="form-control mb-3" min="1" placeholder="Nombre de personnes">

          <label for="filtre-prix" class="form-label fw-semibold">
            Prix maximum : <span id="valeur-prix">300</span> $ / heure
          </label>
          <input type="range" id="filtre-prix" class="form-range mb-3" min="0" max="300" step="10" value="300">

          <button type="submit" class="btn btn-primary w-100 mb-2">
            <i class="fa-solid fa-magnifying-glass me-2"></i>Appliquer
          </button>
          <button type="reset" class="btn btn-outline-secondary w-100">Réinitialiser</button>
        </form>
      </aside>

      <!-- Résultats -->
      <section class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1 class="h4 fw-bold mb-0"><span id="nb-resultats">0</span> espace(s) trouvé(s)</h1>
          <select id="tri" class="form-select w-auto">
            <option value="">Trier par</option>
            <option value="prix-croissant">Prix croissant</option>
            <option value="prix-decroissant">Prix décroissant</option>
            <option value="capacite">Capacité</option>
          </select>
        </div>

        <!-- Les cartes seront ajoutées ici par JavaScript -->
        <div id="liste-espaces" class="row g-4"></div>

        <!-- Affiché seulement si aucun résultat -->
        <div id="aucun-resultat" class="text-center text-muted py-5 d-none">
          <i class="fa-regular fa-face-frown fa-2x mb-2"></i>
          <p>Aucun espace ne correspond à vos critères.</p>
        </div>
      </section>

    </div>
  </main>

  <!-- Pied de page (identique à index.html) -->
  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 Loue-Moi. Tous droits réservés.</p>
      <small class="text-muted">Plateforme de recherche et réservation d'espaces événementiels</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="parcourir.js"></script>
</body>
</html>
